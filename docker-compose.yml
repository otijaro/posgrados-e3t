services:

  db:
    image: postgres:15
    container_name: posgrados_db
    environment:
      POSTGRES_USER: posgrados_user
      POSTGRES_PASSWORD: posgrados_pass
      POSTGRES_DB: posgrados_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posgrados_user -d posgrados_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: posgrados_backend
    environment:
      DATABASE_URL: postgresql://posgrados_user:posgrados_pass@db:5432/posgrados_db
      SECRET_KEY: cambiar-en-produccion-secreto-largo
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      ANTHROPIC_API_KEY: ""
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["sh", "/app/entrypoint.sh"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: posgrados_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
